# Rotation round (docs/experiments/2026-10-02-rotation-yaw.md): the waffle pick-to-box with the tool heading
# commanded (action.rotation=yaw: MOVE ee_delta dx dy dz dyaw). The packet is turned
# uniformly within +-40 deg of its nominal pose and the tool starts turned within +-20 deg,
# so the jaws must be turned across the packet before the grasp. Reach (UR3, demo tilt):
# packet offsets -40..+50 deg are graspable; at the high start pose a negative turn runs
# out of reach after ~27 deg (the manual and the CLAMP text say how to get around it).
extends: sim_waffle.yaml
name: sim_waffle_yaw
task:
  params:
    yaw_dist: uniform
    yaw_max_deg: 40
    start_yaw_deg: 20
action:
  rotation: yaw
episode:
  max_turns: 30
