# Pick the jute ball with the gripper pointing STRAIGHT DOWN. With the default 60-deg tilt every close
# landed in front of the ball (runs/20261014T215535Z_so101_ball: the sloped jaws meet the top of a 50 mm
# ball before the tips pass its middle). Vertical jaws drop on both sides and close at its middle.
# Ball ~(270, -55) mm against the laptop's front edge (~x 295, deck ~18 mm); x capped at 280 mm.
extends: so101_desk.yaml
name: so101_ball_down
task:
  name: pick_ball
  instruction: "Pick up the beige rope ball lying on the table in front of the laptop and lift it 50 mm above the table. The gripper points straight down. Both green jaws are in the image: the left one is fixed, the right one swings toward it when closing. Centre the ball between the two jaw tips in the image, lower the tips to about 10 mm above the table (the jaws must not land on the ball), then close. Report DONE when the ball is held between the jaws and lifted."
robot:
  params:
    tool_pitch_deg: 90
    home_tcp: [0.22, 0.0, 0.08]
    workspace_lo: [0.14, -0.16, 0.008]
    workspace_hi: [0.28, 0.16, 0.09]
episode:
  max_turns: 40
