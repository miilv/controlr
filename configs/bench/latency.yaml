# controlr bench-latency -c configs/bench/latency.yaml [--dry-run]
# calls = models x sizes x history x variants x (1 warm-up + repeats)
#       = 6 x 3 x 3 x 1 x 4 = 216 with the values below — check --dry-run first.
models:
  - no-think/claude/claude-haiku-4-5-20251001
  - claude/claude-haiku-4-5-20251001
  - claude/claude-sonnet-5
  - claude/claude-opus-5-5
  - gpt-5.6-luna-low
  - cx/gpt-6-astra
sizes: [224, 448, 672]
history: [1, 10, 30]
variants:
  - {name: default}
  # - {name: low, extra_body: {reasoning_effort: low}}
  # - {name: low-suffix, model_suffix: "-low"}     # effort-suffixed ids, e.g. claude/claude-sonnet-5-low
repeats: 3
max_tokens: 40
jpeg_quality: 90
frames: null          # frame dir or a run dir (its images/); null -> synthetic frames
cache: auto
cache_ttl: 5m
out_root: runs
