# Ball pick with Opus 5.5, fewer and larger moves, a plan first, lessons from earlier runs, and the
# reasoning written AFTER the action on the STATUS line: llm.overlap_tail executes the moves at the
# STATUS word, the rest of the line streams while the arm moves (usage_grace_s keeps reading it) and
# `controlr run` prints it. Previous: so101_ball_down (Sonnet, 27 turns, under-reaching every time).
extends: so101_ball_down.yaml
name: so101_ball_opus
llm:
  model: claude/claude-opus-5-5          # the -low/-high routes are listed but rejected (400)
  extra_body: {}
  max_tokens: 4000
  usage_grace_s: 20.0                  # let the reasoning after STATUS finish streaming (during the move)
planner:
  enabled: true
  model: claude/claude-opus-5-5
  timeout_s: 300
prompt:
  fewshot: configs/lessons/so101_ball.md
  extra_rules:
    - "Be fast. Estimate the target's full offset in base mm (VIEW: use the TABLE scale for things on the table) and cover it in ONE reply; you may send up to 3 lines (e.g. move above the target, descend, GRIP close). Do not creep; refine only by the error the next image shows."
    - "Write the action lines FIRST, then the STATUS line. Put your reasoning on the STATUS line after the status word, 1-3 sentences: where the target is (base mm), what you expect after this move, and what the previous image taught you. It is streamed while the arm moves; the 12-word note limit does not apply to it."
observation:
  renderers: [aim]
  aim_uv: [0.61, 0.72]               # where the held ball sat in the image (hand-fed grasp, run 20261014T220447Z)
action:
  max_chunk: 3
safety:
  max_step_m: 0.08
episode:
  max_turns: 20
