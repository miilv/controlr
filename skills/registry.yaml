    backend: dojo_skills
    entry: "dojo.skills.precision:insert_each"
    measured: none
    stats: []
    notes: "skills-5 first version"

  - name: screw_on
    side: ilia
    benchmark: robodojo
    doc: |
      Screw each movable threaded part onto its fixed partner (pairs = [[nut, bolt], ...]): the part is put on the
      partner's top, upright and on its axis, let go so it seats on the thread, then turned down the thread in wrist
      sweeps with re-grips (clockwise from above), following the pitch down, until it sits about 1 cm below the
      partner's top. Both grippers are opened after each pair. Pair the parts first (e.g. by colour).
    args:
      pairs: "[[id, id]], required; [movable part, fixed partner] pairs"
      depth: "float m = 0.010; how far below the partner's top the part's bottom ends"
      sign: "float = -1.0; turn direction, -1 = clockwise from above (tightens a right-hand thread)"
    selects_on:
      words: [tighten, screw, fasten, nut, bolt, same colour]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each pair, fields: [pos, quat, size]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.precision:screw_on"
    measured: none
    stats: []
    notes: "skills-5 first version"
