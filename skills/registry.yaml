# J2 skill registry, ilia side (controlr's dojo stack). Same schema as robot-harness's skills/registry.yaml
# (schema j2-registry/1, docs/REGISTRY.md there; validator harness/registry.py): at J4 the entries below move verbatim
# under that file's `# ---- ilia side: added by J4 import ----` marker. Loader here: dojo/agent/registry.py (it also
# loads robot-harness's file unchanged; pinned copy in tests/fixtures/).
# Only name + args + doc reach the chooser. doc and args must not name benchmark tasks, layouts, seeds or task ids
# (rule P4). measured holds robot-harness ledger pointers only (none for this side yet); our numbers are in stats,
# with the journal / experiment report they come from. Object arguments are scene ids: the dojo runtime maps each id
# to its perception estimate (pose, size, catalogue identity), so they read as `object_args`.
schema: j2-registry/1
entries:

  # ---- ilia side: added by J4 import ----

  - name: stack_objects
    side: ilia
    benchmark: robodojo
    doc: |
      Pile the listed objects on top of one another on the table (nest=True: concave objects such as bowls or cups
      inside one another). ordered=False: the skill picks the base, the order and the site; ordered=True: objects[0]
      stays the base and the others go on in list order. Not for pegs, poles or fixtures. Plans with own IK against
      the estimate, re-measures each object from the wrist before contact, opens both grippers when done.
    args:
      objects: "[id], required; the objects to pile"
      nest: "bool = False; nest concave objects inside one another"
      ordered: "bool = False; keep the list order, first id at the bottom"
    selects_on:
      words: [stack, pile, nest, on top of, bottom to top]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:stack_objects"
    measured: none
    stats:
      - {src: docs/journal/2026-10-24-dojo-integ.md, bench: robodojo, cell: stack_blocks, tier: A, verify: bundle, n: 10, success: 10}
      - {src: docs/journal/2026-10-24-dojo-integ.md, bench: robodojo, cell: stack_blocks, tier: B, verify: bundle, version: closed loop, n: 25, success: 17}
      - {src: docs/experiments/2026-10-25-agent-e2e.md, bench: robodojo, cell: stack_bowls, tier: B, verify: "off", version: nest, n: 6, success: 0}
    notes: "grasps from the catalogue mesh of the perceived asset identity (public asset files) at the perceived pose; no privileged poses"

  - name: tower_from_boards
    side: ilia
    benchmark: robodojo
    doc: |
      Build a two-level structure from flat boards and blocks: two pillars, a board across them, two pillars on that
      board, a second board, then the remaining pieces centred on top. Board / pillar / topper roles come from the
      geometry, so pass EVERY piece of the set. Each completed level is banked (both grippers opened).
    args:
      pieces: "[id], required; every board and block of the set"
    selects_on:
      words: [tower, boards, wooden blocks, build]
      needs_categories: [block]
    inputs:
      source: args
      objects:
        - {what: each piece, fields: [pos, quat, size]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:build_tower"
    measured: none
    stats:
      - {src: docs/journal/2026-10-24-dojo-integ.md, bench: robodojo, cell: build_tower, tier: A, verify: bundle, n: 10, success: 10}
      - {src: docs/journal/2026-10-24-dojo-integ.md, bench: robodojo, cell: build_tower, tier: B, verify: "off", n: 10, success: 7}
      - {src: docs/experiments/2026-10-25-agent-e2e.md, bench: robodojo, cell: build_tower, tier: B, verify: "off", n: 6, success: 3}
    notes: "registered under its own name; the library function is build_tower"

  - name: put_into
    side: ilia
    benchmark: robodojo
    doc: |
      Put or drop every listed object into ONE open container (bin, basket, box, tray), with whichever arm reaches,
      handing an object over between the arms through a free table spot when needed. Only "ends up inside" is
      controlled: no orientation, no slots, no order. One container per call; banks after each object.
    args:
      objects: "[id], required; the objects to put in"
      container: "id, required; the open container"
    selects_on:
      words: [into the, throw, put, basket, bin]
      needs_categories: [container]
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size]}
        - {what: container, fields: [pos, quat, size]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:put_into"
    measured: none
    stats:
      - {src: docs/experiments/2026-10-25-agent-e2e.md, bench: robodojo, cell: put_bottles_into_dustbin, tier: B, verify: "off", n: 6, success: 0}
    notes: "mode-B failures were drop misses past the bin and pick collisions (verify off)"

  - name: press_sequence
    side: ilia
    benchmark: robodojo
    doc: |
      Press buttons in exactly the given order, n full press-and-release cycles each, e.g. [[a, 2], [b, 1], [a, 1]].
      Every press counts and nothing else is pressed. A confirm button pressed after each counted group appears once
      per group in the list.
    args:
      presses: "[[id, int]], required; (button, count) pairs in order"
    selects_on:
      words: [press, button, times, confirm]
      needs_categories: [button]
    inputs:
      source: args
      objects:
        - {what: each button, fields: [pos]}
        - {what: number cards, fields: [value]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:press_sequence"
    measured: none
    stats:
      - {src: docs/experiments/2026-10-25-agent-e2e.md, bench: robodojo, cell: press_by_number, tier: A, verify: "off", n: 6, success: 6}

  - name: swap_on_mats
    side: ilia
    benchmark: robodojo
    doc: |
      Swap two objects that sit on two of three mats by way of the empty one: a -> empty mat, b -> a's mat,
      a -> b's mat. With a button, press it once after each of the three moves (press_after_each).
    args:
      objects: "[id, id], required; a and b, the two objects to swap"
      mats: "[id, id, id], required; the three mats"
      button: "id = None; pressed after each move"
      press_after_each: "bool = True"
    selects_on:
      words: [swap, empty mat, after each move]
      needs_categories: [mat]
    inputs:
      source: args
      objects:
        - {what: the two objects, fields: [pos, quat, size]}
        - {what: mats, fields: [pos]}
        - {what: button, fields: [pos]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:swap_on_mats"
    measured: none
    stats: []

  - name: declare_kong
    side: ilia
    benchmark: robodojo
    doc: |
      Mahjong: hold still until the scripted opponent has discarded a tile and its arm is back, tip face up the three
      standing hand tiles that match the discard, then draw a tile from the wall and stand it at the free end of the
      hand row. Pass EVERY mahjong tile in the scene; hand / discard / wall roles come from their poses.
    args:
      tiles: "[id], required; every mahjong tile"
    selects_on:
      words: [kong, opponent, discard, tiles]
      needs_categories: [mahjong]
    inputs:
      source: args
      objects:
        - {what: each tile, fields: [pos, quat, value]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: false
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:declare_kong"
    measured: none
    stats:
      - {src: docs/journal/2026-10-25-dojo-skills2.md, bench: robodojo, cell: make_kong, tier: A, version: v3 G3 twin, n: 25, success: 25}
    notes: "waits on the steps counter and the tiles' estimated poses; never moves while the opponent moves"

  - name: insert_into
    side: ilia
    benchmark: robodojo
    doc: |
      Peg-in-hole: pick obj and insert it into whichever listed receptacle its mesh fits best (slot, socket, keyhole,
      opening) with a slow guided descent; with turn_deg != 0 turn it about the insertion axis before letting go
      (a key in its lock: -60). List only the intended receptacle(s); the fixture obj starts in is skipped.
      Relays between the arms when one arm cannot both pick and insert.
    args:
      obj: "id, required; the object to insert"
      receptacles: "[id], required; the intended receptacle(s)"
      turn_deg: "float deg = 0.0; turn after the insertion"
    selects_on:
      words: [insert, plug, deposit, keyhole, socket, turn it]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: obj, fields: [pos, quat, size]}
        - {what: receptacles, fields: [pos, quat, size]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:insert_into"
    measured: none
    stats:
      - {src: docs/journal/2026-10-25-dojo-skills3.md, bench: robodojo, cell: plug_in_charger, tier: A, version: v2 G3 twin, n: 10, success: 6}
      - {src: docs/journal/2026-10-25-dojo-skills2.md, bench: robodojo, cell: insert_key, tier: A, version: v2 G3 twin, n: 6, success: 0, note: lift credit only}

  - name: place_in_slots
    side: ilia
    benchmark: robodojo
    doc: |
      Put each object into the compartment of the container shaped for it (a slot named after the object's kind, as in
      a fitted tray), compact ones first; one already lying as its slot wants it is carried level, gripped near its
      centre of mass, else re-oriented as the slot requires; both grippers opened after each object.
    args:
      objects: "[id], required; the objects"
      container: "id, required; the container with shaped slots"
    selects_on:
      words: [matching position, each, compartment, tray]
      needs_categories: [container]
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size]}
        - {what: container, fields: [pos, quat]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:place_in_slots"
    measured: none
    stats:
      - {src: docs/journal/2026-10-25-dojo-skills2.md, bench: robodojo, cell: store_tools_in_toolbox, tier: A, version: v3 G3 twin, n: 5, success: 0, mean_score: 0.25}
      - {src: docs/journal/2026-10-26-dojo-skills8.md, bench: robodojo, cell: store_tools_in_toolbox, tier: A, version: skills8 final G3 twin, n: 25, success: 4, mean_score: 0.61}

  - name: fill_container
    side: ilia
    benchmark: robodojo
    doc: |
      Put long objects (pens, sticks, tubes) one by one into an upright holder: each held leading end down just over
      the opening's free spot, the hand kept out of the holder, and let go so it drops in (widest first). A holder out
      of comfortable reach is first carried upright to where both arms reach it. Both grippers opened after each. An
      instruction to hold the holder with one hand, fill it with the other and then put it back down is judged by the
      end state only (the objects in it, the holder upright, both grippers open): this skill fills it standing,
      without holding it, and that is the end state such an instruction asks for.
    args:
      objects: "[id], required; the long objects"
      container: "id, required; the holder"
    selects_on:
      words: [all, into it, holder, rack, hold the]
      needs_categories: [holder]
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size]}
        - {what: holder, fields: [pos, quat, size]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:fill_container"
    measured: none
    stats:
      - {src: docs/journal/2026-10-25-dojo-skills2.md, bench: robodojo, cell: fill_pen_holder, tier: A, version: v2 G3 twin, n: 5, success: 0, mean_score: 0.08}
      - {src: docs/journal/2026-10-26-dojo-skills8.md, bench: robodojo, cell: fill_pen_holder, tier: A, version: skills8 v7 G3 twin, n: 25, success: 1, mean_score: 0.18}

  - name: arrange
    side: ilia
    benchmark: robodojo
    doc: |
      Do every step: "place" = put obj upright on top of support; "push" = slide obj (too wide to grasp) onto or into
      support without lifting it. Steps are independent (any order); both grippers opened after each. For an
      instruction that lists several put-X-on-Y / push-X-into-Y goals. Position only: no heading alignment.
    args:
      steps: "[[verb, id, id]], required; [place | push, object, support] per goal"
    selects_on:
      words: [place the, put the, push the, on the, into the]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size]}
        - {what: each support, fields: [pos, quat, size, top_z]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: true
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:arrange"
    measured: none
    stats:
      - {src: docs/journal/2026-10-25-dojo-skills2.md, bench: robodojo, cell: organize_table, tier: A, version: v1 G3 twin, n: 5, success: 0, mean_score: 0.35}

  - name: stack_on_pegs
    side: ilia
    benchmark: robodojo
    doc: |
      Thread pieces onto the pegs or poles of a base: group i (identical pieces) goes onto peg pegs[i] (a frame of the
      base, as listed for it in the scene), the shortest peg first, one piece at a time, flat, its hole on the peg's
      axis (any turn), carried down the peg onto the pieces below and let go there; a piece left tilted is tried once
      more. Banks after each piece. Which group fits which peg: a peg is as tall as the stack it takes, so the group
      with the most pieces goes onto the highest peg (the z of its frame in the scene), the next largest group onto
      the next highest, and so on.
    args:
      groups: "[[id]], required; the identical pieces for each peg"
      base: "id, required; the object carrying the pegs"
      pegs: "[frame], required; the base's peg frames, one per group"
    selects_on:
      words: [pegs, poles, rings, onto the correct]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each piece, fields: [pos, quat, size]}
        - {what: base, fields: [pos, quat]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.pegs:stack_on_pegs"
    measured: none
    stats:
      - {src: docs/journal/2026-10-26-dojo-skills7.md, bench: robodojo, cell: play_stacking_toy, tier: A, version: v4.6 G3 twin, n: 25, success: 24}
    notes: "skills-7: hole axis from the mesh, pieces seated against one side of the peg (the checker's 1 mm)"

  - name: slots_and_press
    side: ilia
    benchmark: robodojo
    doc: |
      Stand one object in each named slot of the container (slot frames as listed for it in the scene), thinnest axis
      across the slot, lowered to the slot floor; then, with press_tag (a lever or button frame of the container),
      press it down. Pass only as many objects as the instruction asks for.
    args:
      objects: "[id], required; one object per slot, as many as asked"
      container: "id, required; the container with slots"
      slots: "[frame], required; the container's slot frames, one per object"
      press_tag: "frame = None; the lever or button frame pressed after"
    selects_on:
      words: [slots, lever, press the lever, into the]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size]}
        - {what: container, fields: [pos, quat]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:slots_and_press"
    measured: none
    stats: []
    notes: "untested in the twin (no dev records for a slotted appliance yet)"

  - name: hang_on_hooks
    side: ilia
    benchmark: robodojo
    doc: |
      Hang each object by its handle on one of the rack's hooks (hook frames as listed for the rack in the scene):
      the highest hooks, the lowest of them first; carried re-oriented to just beyond a hook's tip, slid along the
      hook through the handle, let go. An object no arm can hang from where it stands is first stood on a spot in
      front of the rack. Banks after each object.
    args:
      objects: "[id], required; the objects with handles"
      rack: "id, required; the fixture with hooks"
      hook_tag: "frame, required; the rack's hook frames"
      handle_tag: "frame = handle; the objects' handle frame"
    selects_on:
      words: [hang, hooks, rack, by the handle]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size]}
        - {what: rack, fields: [pos, quat]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:hang_on_hooks"
    measured: none
    stats:
      - {src: docs/journal/2026-10-26-dojo-skills7.md, bench: robodojo, cell: hang_mugs, tier: A, version: v6.2 G3 twin, n: 25, success: 5}
    notes: "skills-4 first version; skills-7: the rack and hung objects as small mesh boxes, relay"

  - name: fold_garment
    side: ilia
    benchmark: robodojo
    doc: |
      Fold a long-sleeved top lying flat on the table with pinches: each sleeve is pinched at its end and laid on the
      opposite chest (one arm each), then both hem corners are pinched together and laid on the shoulders; grippers
      opened after each fold.
    args:
      garment: "id = null; the garment (null: the one the provider reads)"
    selects_on:
      words: [fold, clothes, shirt]
      needs_categories: []
    inputs:
      source: provider
      objects:
        - {what: garment, fields: [keypoints, pose]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.garment:fold_garment"
    measured: none
    stats: []
    notes: "gennew first version; reads the garment's named points from the provider (GT in G3)"

  - name: play_board_game
    side: ilia
    benchmark: robodojo
    doc: |
      Turn-based placement game against a scripted opponent on a board's cells (cell frames as listed for the board in
      the scene): on our turn put one of our pieces on an empty cell (3 x 3 boards: win, block, centre, corners, edges),
      open both grippers, take both arms home, then hold still until the opponent's piece rests in a cell and its arm
      is at rest. Repeats until the board is full or our pieces are used up.
    args:
      board: "id, required; the board with cell frames"
      pieces: "[id], required; our pieces (the identical kind nearer the robot)"
      opponent_pieces: "[id], required; the opponent's pieces (the other kind)"
    selects_on:
      words: [play, tic-tac-toe, board, first player, opponent]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each piece, fields: [pos, quat, size]}
        - {what: board, fields: [pos, quat]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:play_board_game"
    measured: none
    stats: []
    notes: >-
      watch reads: piece poses on the board every env step while the opponent moves (a new opponent piece within 25 mm
      of a cell, still for 3 reads), then provider.actors_moving() every step until 12 still reads (fallback: hold 60);
      skills-6

  - name: copy_demonstration
    side: ilia
    benchmark: robodojo
    doc: |
      A scripted arm demonstrates: hold still at home while it puts objects into its container one by one, remember
      the order they arrive in, and once its arm is at rest put the matching object of each (same kind, in neither
      container) into our container in that order, both grippers opened after each. Pass every movable object.
    args:
      container: "id, required; our container (the one nearer the robot)"
      demo_container: "id, required; the demonstrator's container"
      objects: "[id], required; every movable object"
    selects_on:
      words: [observe, order, sequence, remember, same order, imitate]
      needs_categories: [basket]
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size, identity]}
        - {what: both containers, fields: [pos, quat]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: true
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:copy_demonstration"
    measured: none
    stats: []
    notes: >-
      watch reads: from step 0, each object's identity and whether its root is inside the demonstrator's container
      (arrival = 4 inside reads; every 5-20 steps suffices, only the order matters), then provider.actors_moving()
      until 12 still reads (fallback: hold 110); skills-6

  - name: match_and_pick
    side: ilia
    benchmark: robodojo
    doc: |
      Objects ride a moving belt: measure the belt's velocity from the objects' motion, remember the first object (the
      one leading in the direction of motion), and pick the next object of the same kind on the move (the hand follows
      the belt through the descent and the close), then lift it about 12 cm and hold it.
    args:
      objects: "[id], required; every object on the belt"
      conveyor: "id = null; the belt (left out of collision checks)"
    selects_on:
      words: [conveyor, first object, matching, appears again, remember]
      needs_categories: []
    inputs:
      source: args
      objects:
        - {what: each object, fields: [pos, quat, size, identity]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args]
    backend: dojo_skills
    entry: "dojo.skills.library:match_and_pick"
    measured: none
    stats: []
    notes: >-
      watch reads: object tracks on the belt (positions 4 steps apart -> velocity; identities), one target re-read at
      the end of the approach (~8 steps before contact; error under ~8 mm needed); skills-6

  - name: fill_holes
    side: ilia
    benchmark: robodojo
    doc: |
      Stand each object (long axis up) over a free hole of the holder's body and let it drop in with the fingers above
      the body; objects lying crowded in a basket are first moved to the table. When every object is in, swing the
      holder's hinged lid (the joint the lid frame rides on) shut.
    args:
      objects: "[id], required; the objects to put in the holes"
      holder: "id, required; the holder with holes and a hinged lid"
      lid_tag: "frame = null; the lid's functional frame"
    selects_on:
      words: [into the holder, holder, close the lid, eggs]
      needs_categories: []
    inputs:
      source: args
      objects:
