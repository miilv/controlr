  - name: pick_into_held
    side: ilia
    benchmark: robodojo
    doc: |
      A container and objects ride a moving belt: take the container off the belt with one arm and hold it up about
      11 cm, then pick the object the board's picture shows on the move with the other arm and drop it into the held
      container, which stays up.
    args:
      objects: "[id], required; every object on the belt"
      container: "id, required; the container to lift"
