      arm: "str = \"auto\""
      by: "float = 0.1"
      obj: "= None"
      z_ref: "= None"
      margin: "float = 0.03"
      tcp_ref: "= None"
      reserve: "= None"
    selects_on:
      words: [lift, raise, higher]
      needs_categories: []
    inputs:
      source: privileged_obs
      objects:
        - {what: held object, fields: [pos]}
    obs_needs:
      contract_only: false
      held_look: false
      refine: false
      twin_verify: false
