# J2 skill registry: one entry per skill, read by one LLM chooser for both runtimes (issue #5).
# Schema and rules: docs/REGISTRY.md. Validate: python3 harness/registry.py
# Only name + args + doc reach the chooser (harness/registry.py chooser_docs). doc and args must not name benchmark
# tasks, layouts, seeds or task ids (rule P4). measured / stats are for people: counts copied from results/ledger.jsonl
# (1-based line numbers), skills/<name>/stats.json, SKILL-NOTES.md, SKILL.md and results/*.md.
# Adapter for other runtimes: import an entry's run() and pass harness/robot_client_v2.Robot(server_id), the socket
# client (v1 robot_client.py is frozen in md5 lists), or call the server verb `skill name=<dir> args={...}`.
schema: j2-registry/1
entries:

  # ---- misha side, RoboDojo, contract_only (selectable in strict runs) ----

  - name: lift_strict
    side: misha
    benchmark: robodojo
    doc: |
      Raise an object one arm already holds until the TCP is `by` m above a reference height (default: its height now).
      Moves straight up, else pulled 6 or 12 cm toward the arm's base when IK refuses. Precondition: that arm's gripper is
      commanded closed and its last held_look said yes. Asks held_look again after the move.
      Verified = still held by the wrist look and the TCP rose >= by. Pass reserve=0 when no return home follows.
    args:
      arm: "left | right | auto = auto (the closed arm whose last look said held)"
      by: "float m = 0.10; required rise"
      obj: "str = None; leave None in strict runs (object mode needs privileged poses)"
      z_ref: "float m = None"
      margin: "float m = 0.03; extra rise"
      tcp_ref: "float m = None (TCP height now)"
      reserve: "int env steps = None (server default 20)"
    selects_on:
      words: [lift, raise, higher]
      needs_categories: []
    inputs:
      source: none
      objects: []
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/lift_strict/skill_robodojo.py:run"
    measured:
      - {line: 9, tier: B_camera, success: 27, n: 30, part: {task: general_pickup, success: 4, n: 5}, via: pick_up_rgb_strict}
    stats: []
    notes: "reads obs objects only when a privileged server provides them (obj given); the strict server never does"

  - name: pick_up_rgb_strict
    side: misha
    benchmark: robodojo
    doc: |
      Pick up one object at a located grasp point and lift it `by` m (default: "by N cm" parsed from the instruction, else 0.10).
      point = [x, y, z] of the object's top; yaw_deg = tool yaw (jaws close along world x at 0). Tries both arms and tilt
      variants by free IK; mode="side" grasps from the front for tops wider than the jaw.
      held_look after the close: "no" re-opens and returns at once so you can re-locate and call again; then lift_strict.
      Verified = gripper closed, last wrist look held, TCP rose >= by.
    args:
      point: "[x, y, z] m, required; grasp point (object top) located from pixels"
      yaw_deg: "float deg = 0.0; top-down tool yaw"
      grasp_z: "float m = None (from point z)"
      by: "float m = None (instruction, else 0.10)"
      margin: "float = 0.03"
      pick_lift: "float = 0.06"
      arm: "left | right | auto = auto"
      pres: "= (0.10, 0.06)"
      final_reserve: "int env steps = 0"
      min_left: "int = 25"
      mode: "top | side = top"
      side_z: "float = 0.815"
      approach: "float = 0.1"
      stop_short: "float = 0.01"
    selects_on:
      words: [pick up, lift, raise, by cm]
      needs_categories: [object]
    inputs:
      source: args
      objects:
        - {what: object, fields: [pos, top_z, quat]}
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look, instruction]
    backend: robot_server
    entry: "skills/pick_up_rgb_strict/skill_robodojo.py:run"
    measured:
      - {line: 9, tier: B_camera, success: 27, n: 30, part: {task: general_pickup, success: 4, n: 5}, via: direct}
    stats:
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: general_pickup, seed: 1, layouts: 0-4, tier: B-strict, version: v1 (md5 31d34e79), n: 5, success: 4}
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: general_pickup, seed: 0, layouts: '9', tier: B-strict, version: 'v1 (practice, no code change after)', n: 1, success: 1, infra_reruns: 1}

  - name: place_on_rgb_strict
    side: misha
    benchmark: robodojo
    doc: |
      Put a located block on top of another located block or on a table point, one stage per call; re-locate after every stage.
      stage=plan: blocks=[{name, c: [x, y], top_z, yaw, size}] -> base block, order and arms by free IK (0 env steps).
      stage=pick: arm, block, clear_top_z -> top-down grasp, held_look after the close and after the lift; returns bottom_off.
      stage=place: arm, base={c, top_z, yaw} (table point: top_z 0.765), bottom_off -> hover, lower, open, lift clear.
      Precondition for place: the pick's last look said held. Placement is checked by your re-look.
    args:
      stage: "plan | pick | place, required"
      blocks: "list[{name, c: [x, y], top_z, yaw, size}], required (stage plan)"
      arm: "left | right (| auto for pick), required (stage pick, place)"
      block: "{name, c: [x, y], top_z, yaw, size}, required (stage pick)"
      clear_top_z: "float m = None; highest support the carry must clear (stage pick)"
      support_z: "float m = 0.765 (table); what the block stands on (stage pick)"
      pre: "float = 0.1 (stage pick)"
      min_lift: "float = 0.08 (stage pick)"
      base: "{c: [x, y], top_z, yaw}, required; block or table point (stage place)"
      bottom_off: "float m, required; from the pick reply (stage place)"
      release_dz: "float = 0.004 (stage place)"
      hover_dz: "float = 0.05 (stage place)"
      clear_dz: "float = 0.05 (stage place)"
      yaw_mod: "float = 90.0 (stage place)"
    selects_on:
      words: [stack, on top of, put on, place on]
      needs_categories: [block]
    inputs:
      source: args
      objects:
        - {what: block, fields: [pos, top_z, quat, size]}
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/place_on_rgb_strict/skill_robodojo.py:run"
    measured:
      - {line: 9, tier: B_camera, success: 27, n: 30, part: {task: stack_blocks, success: 5, n: 5}, via: direct}
    stats:
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: stack_blocks, seed: 1, layouts: 0-4, tier: B-strict, version: v1 (md5 e1f62c1d), n: 5, success: 5, by_hand: 1}
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: stack_blocks, seed: 0, layouts: '9', tier: B-strict, version: v1 (practice), n: 1, success: 1, by_hand: 1}
    notes: "reuses place_on's free-IK planning helpers on synthetic records; never reads obs objects"

  - name: planar_drag_rgb_strict
    side: misha
    benchmark: robodojo
    doc: |
      Slide a flat object along the table to a target pose (xy + yaw) with closed fingers, never lifting it.
      t_pose and pad_pose = [x, y, yaw] of the same object-frame point and heading on the object and on its target; t_top = the
      object's located top height. stage=plan: single-arm or relay plan by free IK (0 env steps). stage=drag: one grasp, drag,
      release and 5 cm lift per call (legs=1); held_look after the close ("no" = open and return).
      Re-locate after every leg and call again to correct or to finish a relay. Reply errors are belief-side, not measurements.
    args:
      t_pose: "[x, y, yaw_deg], required; located object pose"
      pad_pose: "[x, y, yaw_deg], required; target pose"
      t_top: "float m, required; located top height"
      stage: "plan | drag = drag"
      pad_z: "float = 0.767"
      legs: "int = 1"
      home: "bool = False"
      arm: "= None"
      hover_z: "float = 0.83"
      grasp_yaw_offsets: "= (90,)"
      "**kw": "passed to the drag core (chunk_m, speed, fine_tol_m, ...)"
    selects_on:
      words: [push, slide, drag, align, move to the target]
      needs_categories: [T, T pad]
    inputs:
      source: args
      objects:
        - {what: flat object, fields: [pos, quat, top_z]}
        - {what: target pad, fields: [pos, quat]}
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/planar_drag_rgb_strict/skill_robodojo.py:run"
    measured:
      - {line: 9, tier: B_camera, success: 27, n: 30, part: {task: push_T, success: 5, n: 5}, via: direct}
    stats:
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: push_T, seed: 1, layouts: 0-4, tier: B-strict, version: v1 (md5 7e2c71e1), n: 5, success: 5}
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: push_T, seed: 0, layouts: '9', tier: B-strict, version: v1 (practice), n: 1, success: 1}
    notes: "runs planar_drag v1 behind a belief robot; its grasp test is patched to the held_look answer"

  - name: pour_rgb_strict
    side: misha
    benchmark: robodojo
    doc: |
      Pick a located cup by its side, pour its loose contents into a located container, set the cup back upright where it
      was, and return both arms home. cup = {xy, R (rim radius), h}; vase = {xy, top (rim z), r (opening radius)}.
      Runs the whole tilt profile `phis` (the belief cannot see the contents leave). held_look after the close: "no" leaves
      the belief cup on the table, so the skill reports a failed grasp and homes. verified is None: check cup and container
      in a re-look.
    args:
      cup: "{xy: [x, y], R: m, h: m}, required"
      vase: "{xy: [x, y], top: m, r: m}, required"
      n_balls: "int = 7; belief contents"
      phis: "list[deg] = (0, 40, 65, 80, 88, 94, 100, 106, 112); roll profile"
      "**kw": "passed to the pour core (arm, pitches, yaws, ...)"
    selects_on:
      words: [pour, empty into, tip]
      needs_categories: [cup, vase, ball]
    inputs:
      source: args
      objects:
        - {what: cup, fields: [pos, radius, height]}
        - {what: vase, fields: [pos, top_z, radius]}
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/pour_rgb_strict/skill_robodojo.py:run"
    measured:
      - {line: 9, tier: B_camera, success: 27, n: 30, part: {task: pour_balls_into_vase, success: 3, n: 5}, via: direct}
    stats:
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: pour_balls_into_vase, seed: 1, layouts: 0-4, tier: B-strict, version: v1 (md5 9d08df35), n: 5, success: 3}
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: pour_balls_into_vase, seed: 0, layouts: '9', tier: B-strict, version: v1 (practice), n: 1, success: 1}
    notes: "runs pour v1.1 behind a belief robot; finger fields of its logs are null under the strict server and scrubbed"

  - name: press_button_rgb_strict
    side: misha
    benchmark: robodojo
    doc: |
      Press three located spring buttons with closed fingers in a counted sequence, then return home.
      buttons = {red0: [x, y, cap_top_z], red1: [...], blue: [...]}; counts = [n0, n1], the digits shown above red0 / red1.
      order="rule": red0 x n0, blue, red1 x n1, blue. order="instruction": red0 x n0, red1 x n1, blue.
      Each press is checked from TCP depth; a clear miss is re-pressed once, an uncertain press never. Needs a strict server.
    args:
      buttons: "{red0: [x, y, cap_top_z], red1: [...], blue: [...]}, required"
      counts: "[n0, n1] int, required"
      order: "rule | instruction = rule"
      cap_h: "float m = 0.0309"
      up_dz: "float = 0.034"
      push_dz: "float = 0.006"
      yaw_deg: "int = 90"
      speed: "str = \"slow\""
      retries: "int = 1"
      home: "bool = True"
    selects_on:
      words: [press, button, times, number]
      needs_categories: [button red, button blue, number card]
    inputs:
      source: args
      objects:
        - {what: button, fields: [pos, top_z, colour]}
        - {what: number card, fields: [value]}
    obs_needs:
      contract_only: true
      held_look: false
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/press_button_rgb_strict/skill_robodojo.py:run"
    measured:
      - {line: 9, tier: B_camera, success: 27, n: 30, part: {task: press_by_number, success: 5, n: 5}, via: direct}
    stats:
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: press_by_number, seed: 1, layouts: 0-4, tier: B-strict, version: v1 (md5 f91a7d03), n: 5, success: 5}
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: press_by_number, seed: 0, layouts: '9', tier: B-strict, version: v1 (practice), n: 1, success: 1}
    notes: "order=rule is a checker prior read from the public task code (disclose when used); the closed-fingers check is the command alone (no finger measurement)"

  - name: swap_poses_rgb_strict
    side: misha
    benchmark: robodojo
    doc: |
      Exchange the table poses of two located flat objects, one stage per call; re-look between stages.
      stage=pick: arm, g = [x, y] grasp point, yaw (heading), top_z, target = [x, y, yaw] it will go to, optional park
      = [x, y, z] -> grasp, lift to carry_z, held_look. Returns tool_yaw, rel_yaw, gz.
      stage=place: arm, target, rel_yaw, obj_yaw, gz -> staged carry, lower, open, retreat, optional home.
      stage=pre then stage=grasp split the pick so a wrist look can refine the pose. Placement is checked by your re-look.
    args:
      stage: "pick | place | pre | grasp, required"
      arm: "left | right, required"
      g: "[x, y], required; grasp point on the object (stage pick, pre, grasp)"
      yaw: "float deg, required; object heading (stage pick, pre, grasp)"
      top_z: "float m, required; located top height (stage pick, pre, grasp)"
      target: "[x, y, yaw], where the object goes (stage pick, pre: optional; place: required)"
      park: "[x, y, z] = None; park pose after the lift (stage pick, pre, grasp)"
      offsets: "= (90, 0) (stage pick, pre)"
      carry_z: "float = 0.86 (stage pick, place, pre, grasp)"
      grasp_dz: "float = 0.004 (stage pick, pre, grasp)"
      rel_yaw: "float deg, required; from the pick reply (stage place, grasp)"
      obj_yaw: "float deg, required; heading now (stage place)"
      gz: "float m, required; TCP height at the close, from the pick reply (stage place)"
      release_dz: "float = 0.003 (stage place)"
      retreat: "float = 0.05 (stage place)"
      home: "= None | [right] | [left, right]; return_home after the place (stage place)"
    selects_on:
      words: [swap, exchange, trade places]
      needs_categories: [T]
    inputs:
      source: args
      objects:
        - {what: flat object, fields: [pos, quat, top_z]}
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/swap_poses_rgb_strict/skill_robodojo.py:run"
    measured:
      - {line: 9, tier: B_camera, success: 27, n: 30, part: {task: swap_T, success: 5, n: 5}, via: direct}
    stats:
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: swap_T, seed: 1, layouts: 0-4, tier: B-strict, version: v1 (md5 5552f9e0), n: 5, success: 5}
      - {src: results/RESULTS-rgb-heldout-seed1-strict.md, bench: robodojo, cell: swap_T, seed: 0, layouts: '9', tier: B-strict, version: v1 (practice), n: 1, success: 1}
    notes: "reuses swap_poses' variant check and staged carry; never reads obs objects"

  - name: put_into_bin_rgb_strict
    side: misha
    benchmark: robodojo
    doc: |
      Put located objects into located containers, one stage per call (re-look after each): one container for all, or
      groups -> containers. objects = [{name, kind standing|lying, c, top_z, h, len, wid, yaw}]; containers = [{name,
      lo: [x0, y0, z_floor], hi: [x1, y1, z_rim]}]. stage=plan (0 env steps): arms, container map, direct or relay per object.
      stage=direct: arm, obj, container -> pick and drop. stage=relay: arm, obj -> set it down where both arms reach.
      held_look after each close and after the lift. Finish with the server's return_home.
    args:
      stage: "plan | direct | relay, required"
      objects: "list[{name, kind: standing|lying, c: [x, y], top_z, h, len, wid, yaw}] = None"
      containers: "list[{name, lo: [x0, y0, z_floor], hi: [x1, y1, z_rim]}] = None"
      obj: "str = None; object name (direct, relay)"
      container: "str = None; container name (direct)"
      arm: "left | right = None (direct, relay)"
      groups: "{group: [object names]} = None; one container per group (plan)"
      neck_depth: "float = 0.045"
      lift: "float = 0.08"
      max_picks: "int = 2"
      attach_xy: "float = 0.05"
    selects_on:
      words: [put into, throw away, sort, into the bin, into the basket]
      needs_categories: [bottle, basket, dustbin, object]
    inputs:
      source: args
      objects:
        - {what: object, fields: [pos, top_z, size, quat]}
        - {what: container, fields: [lo, hi]}
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/put_into_bin_rgb_strict/skill_robodojo.py:run"
    measured: none
    stats: []
    notes: "not validated in a full episode by its author; the v2 variant carries the measured basket rows"

  - name: put_into_bin_rgb_strict_v2
    side: misha
    benchmark: robodojo
    doc: |
      Put located objects into located containers stage by stage, with rim-aware drops (every corner of the held object
      inside the rim), edge- and wall-aware picks and a budget-aware finish. Records as put_into_bin_rgb_strict, plus optional
      table = {x: [left, right], y: [near, far]}. Stages: plan, direct (arm, obj, container[, final]), relay, nudge (push an
      object 6 cm off a container wall), survey (arms to a high pose so the head camera sees under them), home, check.
      final=True refuses a stage that leaves no room for the cheapest home. held_look after each close and after the lift.
    args:
      stage: "plan | direct | relay | nudge | survey | home | check, required"
      objects: "list[{name, kind: standing|lying, c: [x, y], top_z, h, len, wid, yaw}] = None"
      containers: "list[{name, lo: [x0, y0, z_floor], hi: [x1, y1, z_rim]}] = None"
      obj: "str = None; object name (direct, relay)"
      container: "str = None; container name (direct)"
      arm: "left | right = None (direct, relay)"
      groups: "{group: [object names]} = None; one container per group (plan)"
      table: "{x: [left, right], y: [near, far]} = None"
      arms: "list = None; arms for survey / home"
      final: "bool = False; refuse a stage that leaves no room for the cheapest home"
      lift: "float = 0.08"
      max_picks: "int = 2"
      attach_xy: "float = 0.05"
      margin: "float = 0.02"
      clear: "float = 0.025"
      d: "float = 0.06"
      mode: "str = \"auto\""
      margin_m: "float = 0.04"
      margin_deg: "float = 7.0"
      ignore_walls: "= None"
      edge: "= None"
      poses: "= None"
      avoid: "= None"
    selects_on:
      words: [put into, throw away, sort, into the bin, into the basket]
      needs_categories: [bottle, basket, dustbin, object]
    inputs:
      source: args
      objects:
        - {what: object, fields: [pos, top_z, size, quat]}
        - {what: container, fields: [lo, hi]}
    obs_needs:
      contract_only: true
      held_look: wrist
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik, object_args, held_look]
    backend: robot_server
    entry: "skills/put_into_bin_rgb_strict_v2/skill_robodojo.py:run"
    default: true
    measured:
      - {line: 11, tier: B_camera, success: 4, n: 5, part: {task: classify_objects, success: 4, n: 5}, via: direct}
      - {line: 12, tier: B_camera, success: 2, n: 5, part: {task: put_bottles_into_dustbin, success: 2, n: 5}, via: direct}
    stats:
      - {src: results/ROBODOJO-BASKET-r1.md, bench: robodojo, cell: classify_objects, seed: 0, layouts: 0-4, tier: B-strict, version: v1 (md5 fe34d4a0), n: 5, success: 4}
      - {src: results/ROBODOJO-BASKET-r1.md, bench: robodojo, cell: put_bottles_into_dustbin, seed: 0, layouts: 0-4, tier: B-strict, version: v1 (md5 fe34d4a0), n: 5, success: 2}
    notes: "refuses a privileged server; home stage = return_home_budget"

  - name: return_home_budget
    side: misha
    benchmark: robodojo
    doc: |
      Finish an episode with both arms inside the home tolerance (0.15 m per axis, 20 deg) at the least env-step cost.
      mode="auto": the exact return_home if it fits in the steps left, else cheaper near-home moves; "full" / "near" force
      one; dry=True only reports the costs. Opens a closed gripper first. Reads proprioception and 0-step dry runs only.
    args:
      mode: "str = \"auto\""
      home_q: "= None"
      home_flange: "= None"
      margin_m: "float = 0.04"
      margin_deg: "float = 7.0"
      dry: "bool = False"
      arms: "= None"
    selects_on:
      words: [return home, back to the start, finish]
      needs_categories: []
    inputs:
      source: none
      objects: []
    obs_needs:
      contract_only: true
      held_look: false
      refine: false
      twin_verify: false
      reads: [joints, flange, grip_cmd, steps, free_ik]
    backend: robot_server
    entry: "skills/return_home_budget/skill_robodojo.py:run"
    measured:
      - {line: 11, tier: B_camera, success: 4, n: 5, part: {task: classify_objects, success: 4, n: 5}, via: put_into_bin_rgb_strict_v2}
      - {line: 12, tier: B_camera, success: 2, n: 5, part: {task: put_bottles_into_dustbin, success: 2, n: 5}, via: put_into_bin_rgb_strict_v2}
    stats: []
    notes: "not a _strict copy, but reads only contract fields, so it is selectable in strict runs"

  # ---- misha side, RoboDojo, not contract_only (never selected in strict runs) ----

  - name: lift
    side: misha
    benchmark: robodojo
    doc: |
      Raise an object one arm already holds until it is `by` m above a reference height: its root with privileged poses
      (obj given), else the TCP. Moves straight up, else pulled toward the arm's base when IK refuses.
