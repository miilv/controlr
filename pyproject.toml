[project]
name = "controlr"
version = "0.1.0"
description = "A robotics harness: camera frames + robot operating manual -> vision LLM via API -> low-level robot actions, turn by turn."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
controlr = "controlr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["controlr*"]

[tool.setuptools.package-data]
"controlr" = ["prompts/*.md", "prompts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the live LLM endpoint (run with CONTROLR_LIVE=1)",
  "isaac: needs the Isaac Sim server on compute3 (run with CONTROLR_ISAAC=1)",
]
