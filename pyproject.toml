[project]
name = "controlr"
version = "0.1.0"
description = "A robotics harness: camera frames + robot operating manual -> vision LLM via API -> low-level robot actions, turn by turn."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# dojo/perception: asset catalogue, camera model, inverse layout (remote machines only)
perception = [
  "usd-core>=24.5",
  "trimesh>=4.4",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "pyrender>=0.1.45",
  "networkx>=3",
  "shapely>=2",
  "rtree>=1.2",
  "yourdfpy>=0.0.56",
  # RoboDojo's utils.cluttered_generator (the twin-layout template, dojo.runtime.estimate._template -> gen_layouts)
  # imports these at module level; the bridge runs the policy in this venv, not in RoboDojo's python
  "tqdm>=4.60",
  "transforms3d>=0.4",
]

[project.scripts]
controlr = "controlr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["controlr*", "dojo*"]

[tool.setuptools.package-data]
"controlr" = ["prompts/*.md", "prompts/*.yaml"]
"dojo.perception" = ["*.json"]
"dojo.skills" = ["data/*.json"]
"dojo.perception.agentic" = ["prompts/*.md", "*.json", "vendor/*.md", "vendor/*.py", "vendor/*.txt", "vendor/*.md5", "vendor/robodojo/*.py", "vendor/libero/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the live LLM endpoint (run with CONTROLR_LIVE=1)",
  "isaac: needs the Isaac Sim server on compute3 (run with CONTROLR_ISAAC=1)",
]
